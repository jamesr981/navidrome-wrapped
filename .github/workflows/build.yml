name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.44.0'

      - name: Test
        run: make test

      - name: Build plugin
        # v1.2.3 tag -> version 1.2.3; anything else is a 0.0.0-dev+<commit> build
        run: make build VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: navidrome-wrapped
          path: navidrome-wrapped.ndp
          if-no-files-found: error
