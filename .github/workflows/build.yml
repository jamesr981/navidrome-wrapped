name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the plugin to releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.44.0'

      - name: Test
        run: make test

      - name: Build plugin
        # release v1.2.3 -> version 1.2.3; anything else is a 0.0.0-dev+<commit> build
        run: make build VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: navidrome-wrapped
          path: navidrome-wrapped.ndp
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber replaces the file if the release already has one (e.g. a re-run)
        run: gh release upload "${{ github.event.release.tag_name }}" navidrome-wrapped.ndp --clobber
