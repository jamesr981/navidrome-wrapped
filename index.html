<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrapped</title>
<style>
:root{--bg:#2b2bff;--fg:#ffe66b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding:48px 24px}
main{max-width:640px;margin:0 auto}
h1{font-family:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;font-weight:800;font-stretch:condensed;font-size:clamp(64px,18vw,140px);line-height:.85}
p.lede{font-size:18px;margin:14px 0 36px;max-width:40ch;line-height:1.4}
ul{list-style:none;display:flex;flex-direction:column;gap:2px}
a{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:18px 4px;color:inherit;text-decoration:none;border-top:1.5px solid currentColor}
a:hover .n,a:focus-visible .n{text-decoration:underline}
a:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.n{font-size:22px;font-weight:700}
.m{font-size:14px;opacity:.85;grid-column:1}
.k{grid-row:1/3;grid-column:2;align-self:center;font-family:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;font-weight:800;font-size:30px;text-align:right;line-height:1}
.k small{display:block;font:600 12px system-ui,sans-serif;opacity:.8}
.empty{border-top:1.5px solid currentColor;padding-top:18px}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p class="lede">Everyone's year in music on this server. Pick a name to play their story.</p>
<ul id="l"></ul>
</main>
<script>
const D=/*__WRAPPED_DATA__*/null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("h").textContent=(D&&D.year||"")+" Wrapped";
document.title=document.getElementById("h").textContent;
const u=(D&&D.users)||[];
document.getElementById("l").innerHTML=u.length?u.map(x=>`<li><a href="${encodeURIComponent(x.file)}">
  <span class="n">${esc(x.displayName)}</span>
  <span class="m">${esc(x.topArtist?("Top artist: "+x.topArtist):"")}${x.personality?" · "+esc(x.personality):""}</span>
  <span class="k">${Number(x.minutes).toLocaleString()}<small>minutes</small></span></a></li>`).join("")
  :`<li class="empty">No one has enough plays yet. Generate Wrapped again once people have been listening for a while.</li>`;
</script>
</body>
</html>
