<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2bff">
<title>Wrapped</title>
<style>
:root{
  --display:"Bahnschrift","DIN Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#2b2bff; --fg:#ffe66b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);transition:background .5s}
.card{position:relative;width:min(100vw,calc(100dvh*9/16),460px);height:min(100dvh,calc(min(100vw,460px)*16/9));
  background:var(--bg);color:var(--fg);overflow:hidden;transition:background .5s,color .5s}
@media (min-width:600px){.card{border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);height:min(92dvh,calc(460px*16/9));width:min(460px,calc(92dvh*9/16))}}
.bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
.bars i{flex:1;height:3px;border-radius:2px;background:currentColor;opacity:.3;overflow:hidden;position:relative}
.bars i.done{opacity:1}
.bars i.on{opacity:1;background:transparent}
.bars i.on::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.3}
.bars i.on::after{content:"";position:absolute;inset:0;background:currentColor;transform-origin:left;animation:fill var(--dur,7s) linear forwards}
.paused .bars i.on::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.top{position:absolute;top:24px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:13px;font-weight:600}
.top button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 8px;border-radius:8px}
.top button:focus-visible,.nav:focus-visible,.replay:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.slide{position:absolute;inset:0;padding:72px 26px 34px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.nav{position:absolute;top:60px;bottom:0;width:38%;z-index:4;background:none;border:0;cursor:pointer}
.nav.prev{left:0;width:30%}.nav.next{right:0;width:70%}
.lede{font-size:20px;line-height:1.3;font-weight:600;max-width:24ch}
.small{font-size:15px;line-height:1.45;opacity:.85;max-width:32ch}
.huge{font-family:var(--display);font-weight:800;font-stretch:condensed;line-height:.86;letter-spacing:-.01em;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;font-stretch:condensed;font-size:44px;line-height:.95;letter-spacing:-.005em;overflow-wrap:anywhere}
.art{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;display:block;background:color-mix(in srgb,var(--fg) 18%,transparent)}
.art.round{border-radius:50%}
.ph{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:64px;color:var(--bg);background:var(--fg)}
.hero{width:72%;align-self:flex-start;margin-bottom:6px}
.list{list-style:none;display:flex;flex-direction:column;gap:12px}
.list li{display:grid;grid-template-columns:52px 54px 1fr;align-items:center;gap:12px}
.list .n{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--fg);text-align:right}
.list li:first-child .n{color:var(--fg)}
.list .art{width:54px;border-radius:4px}
.list .t{font-weight:700;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list .s{font-size:13px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.genres{display:flex;flex-direction:column;gap:2px}
.genres div{font-family:var(--display);font-weight:800;font-stretch:condensed;line-height:.95;overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px}
.chart b{flex:1;background:currentColor;opacity:.35;border-radius:2px 2px 0 0;min-height:2px;transform-origin:bottom}
.chart b.hi{opacity:1}
.axis{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.facts dt{font-size:13px;opacity:.8}
.facts dd{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.code{display:flex;gap:6px}
.code span{flex:1;aspect-ratio:.8;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:54px;border:2px solid currentColor;border-radius:6px}
.code span:nth-child(odd){background:var(--fg);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1.5px solid currentColor;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.summary{justify-content:flex-start;padding-top:64px;gap:12px}
.summary .head{display:grid;grid-template-columns:44% 1fr;gap:14px;align-items:end}
.summary .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.summary h3{font-size:13px;font-weight:600;opacity:.8;margin-bottom:6px}
.summary ol{list-style:none;font-size:14px;font-weight:700;line-height:1.55}
.summary ol li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary ol li span{display:inline-block;width:1.3em;opacity:.7;font-weight:600}
.summary .kv{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.8}
.replay{position:relative;z-index:6;border:1.5px solid currentColor;background:none;color:inherit;font:600 14px var(--text);padding:8px 14px;border-radius:99px;cursor:pointer}
.in>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.12s}.in>*:nth-child(3){animation-delay:.24s}.in>*:nth-child(4){animation-delay:.36s}.in>*:nth-child(5){animation-delay:.48s}.in>*:nth-child(n+6){animation-delay:.6s}
.in .chart b{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
@keyframes grow{from{transform:scaleY(0)}}
.empty{display:grid;place-items:center;height:100%;padding:30px;text-align:center}
@media (prefers-reduced-motion:reduce){.in>*,.in .chart b{animation:none}.bars i.on::after{animation:none;transform:scaleX(1)}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="card" id="card" role="region" aria-roledescription="story" aria-label="Your year in music">
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="top"><span id="who"></span><button id="pause" type="button" aria-label="Pause">Pause</button></div>
  <div id="slot" aria-live="polite"></div>
  <button class="nav prev" type="button" aria-label="Previous slide"></button>
  <button class="nav next" type="button" aria-label="Next slide"></button>
</div></div>
<script>
const D = /*__WRAPPED_DATA__*/null;

const THEMES = [
  ["#2b2bff","#ffe66b"], // ultramarine / butter
  ["#ff4f2e","#ffd6ec"], // tomato / blush
  ["#2a0f3a","#3ee6c1"], // plum / teal
  ["#141c52","#ff3d8b"], // navy / magenta
  ["#0d3b2e","#d7f25c"], // forest / chartreuse
  ["#ffe66b","#2b2bff"], // butter / ultramarine
  ["#ffd6ec","#c4142e"], // blush / crimson
];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString();
const hour=h=>{const s=h%12||12;return s+(h<12?" AM":" PM")};
const day=d=>{if(!d)return"";const x=new Date(d+"T12:00:00");return x.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})};
const shortDay=d=>{if(!d)return"";const x=new Date(d+"T12:00:00");return x.toLocaleDateString(undefined,{day:"numeric",month:"short"})};
const initials=s=>String(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function art(item,cls=""){
  if(item&&item.image) return `<img class="art ${cls}" src="${item.image}" alt="">`;
  return `<div class="art ph ${cls}" aria-hidden="true">${esc(initials(item&&item.name))}</div>`;
}
function list(items,sub){
  return `<ol class="list">${items.map((x,i)=>`<li><span class="n">${i+1}</span>${art(x)}<div><div class="t">${esc(x.name)}</div><div class="s">${esc(sub(x))}</div></div></li>`).join("")}</ol>`;
}
const plays=n=>n===1?"1 play":fmt(n)+" plays";

function buildSlides(d){
  const S=[];
  const first=s=>s&&s[0];
  S.push({html:`
    <p class="lede">${esc(d.displayName)}, your year in music is ready.</p>
    <div class="huge fit">${d.year}</div>
    <p class="big">Wrapped</p>
    <p class="small">Tap the right side to continue, the left side to go back.</p>`});
  S.push({html:`
    <p class="lede">You spent this much time listening</p>
    <div class="huge fit" data-count="${d.totalMinutes}">${fmt(d.totalMinutes)}</div>
    <p class="big">minutes</p>
    <p class="small">That's ${fmt(Math.round(d.totalMinutes/60))} hours, across ${fmt(d.totalPlays)} plays of ${fmt(d.uniqueTracks)} different songs by ${fmt(d.uniqueArtists)} artists.</p>`});
  if(d.firstSong) S.push({html:`
    <p class="lede">The first song you played this year</p>
    <div class="hero">${art({...d.firstSong.song,name:d.firstSong.song.name})}</div>
    <p class="big">${esc(d.firstSong.song.name)}</p>
    <p class="small">${esc(d.firstSong.song.subtitle)}<br>${esc(d.firstSong.when)}</p>`});
  if(d.topGenres&&d.topGenres.length){
    const g=d.topGenres.slice(0,5), max=g[0].plays;
    S.push({html:`
      <p class="lede">Your sound this year</p>
      <div class="genres">${g.map(x=>`<div style="font-size:${Math.round(26+40*x.plays/max)}px;opacity:${(.45+.55*x.plays/max).toFixed(2)}">${esc(x.name)}</div>`).join("")}</div>
      <p class="small">${esc(g[0].name)} made up ${Math.round(g[0].share*100)}% of your listening.${d.topDecade?` Your favourite decade was the ${esc(d.topDecade)}.`:""}</p>`});
  }
  const ta=first(d.topArtists);
  if(ta){
    S.push({html:`
      <p class="lede">Your top artist</p>
      <div class="hero">${art(ta,"round")}</div>
      <p class="big">${esc(ta.name)}</p>
      <p class="small">${plays(ta.plays)}, ${fmt(ta.minutes)} minutes. That's ${Math.max(1,Math.round(ta.share*100))}% of everything you played.</p>`});
    if(d.topArtists.length>1) S.push({html:`<p class="lede">Your top artists</p>${list(d.topArtists,x=>plays(x.plays))}`});
  }
  const ts=first(d.topSongs);
  if(ts){
    S.push({html:`
      <p class="lede">Your song of the year</p>
      <div class="hero">${art(ts)}</div>
      <p class="big">${esc(ts.name)}</p>
      <p class="small">${esc(ts.subtitle)}. You played it ${fmt(ts.plays)} times.</p>`});
    if(d.topSongs.length>1) S.push({html:`<p class="lede">Your top songs</p>${list(d.topSongs,x=>x.subtitle+" · "+plays(x.plays))}`});
  }
  const al=first(d.topAlbums);
  if(al) S.push({html:`
    <p class="lede">The album you kept coming back to</p>
    <div class="hero">${art(al)}</div>
    <p class="big">${esc(al.name)}</p>
    <p class="small">${esc(al.subtitle)}. ${plays(al.plays)} from this album.</p>`});
  if(d.onRepeat) S.push({html:`
    <p class="lede">On ${esc(day(d.onRepeat.date))}, one song had you hooked</p>
    <div class="hero" style="width:56%">${art(d.onRepeat.song)}</div>
    <p class="big">${esc(d.onRepeat.song.name)}</p>
    <p class="small">${esc(d.onRepeat.song.subtitle)}. You played it ${d.onRepeat.plays} times that day.</p>`});
  {
    const h=d.hourPlays||[], mx=Math.max(1,...h);
    const night=d.peakHour>=21||d.peakHour<5, morning=d.peakHour>=5&&d.peakHour<11;
    S.push({html:`
      <p class="lede">${night?"You came alive after dark":morning?"You started your days with music":"Music carried you through the day"}</p>
      <div class="huge fit">${hour(d.peakHour)}</div>
      <div><div class="chart">${h.map((v,i)=>`<b class="${i===d.peakHour?"hi":""}" style="height:${Math.round(100*v/mx)}%;animation-delay:${i*25}ms"></b>`).join("")}</div>
      <div class="axis"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>11 PM</span></div></div>
      <p class="small">Your busiest listening hour. ${fmt(h[d.peakHour]||0)} plays started between ${hour(d.peakHour)} and ${hour((d.peakHour+1)%24)}.</p>`});
  }
  {
    const m=d.monthMinutes||[], mx=Math.max(1,...m), tm=d.topMonth-1;
    S.push({html:`
      <p class="lede">Your biggest month</p>
      <div class="huge fit">${MONTHS[tm]||""}</div>
      <div><div class="chart" style="height:120px">${m.map((v,i)=>`<b class="${i===tm?"hi":""}" style="height:${Math.round(100*v/mx)}%;animation-delay:${i*40}ms"></b>`).join("")}</div>
      <div class="axis"><span>Jan</span><span>Apr</span><span>Jul</span><span>Oct</span><span>Dec</span></div></div>
      <p class="small">${fmt(m[tm]||0)} minutes of music in ${MONTHS[tm]||""}.</p>`});
  }
  S.push({html:`
    <p class="lede">Some numbers from your year</p>
    <dl class="facts">
      <div><dt>Days with music</dt><dd>${fmt(d.activeDays)}</dd></div>
      <div><dt>Longest streak</dt><dd>${fmt(d.longestStreak)} days</dd></div>
      <div><dt>Biggest day, ${esc(shortDay(d.biggestDay&&d.biggestDay.date))}</dt><dd>${fmt(d.biggestDay&&d.biggestDay.plays)} plays</dd></div>
      <div><dt>Albums played</dt><dd>${fmt(d.uniqueAlbums)}</dd></div>
    </dl>
    ${d.longestStreak>1?`<p class="small">You listened every day from ${esc(shortDay(d.streakStart))} to ${esc(shortDay(d.streakEnd))}.</p>`:""}`});
  if(d.personality&&d.personality.name) S.push({html:`
    <p class="lede">Your listening personality</p>
    <div class="code">${String(d.personality.code||"").split("").map(c=>`<span>${esc(c)}</span>`).join("")}</div>
    <p class="big">${esc(d.personality.name)}</p>
    <p class="small">${esc(d.personality.tagline)}</p>
    <div class="chips">${(d.personality.traits||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>`});
  S.push({cls:"summary",dur:0,html:`
    <div class="head">${art(ta||{name:d.displayName},ta?"round":"")}<div><p class="small">${esc(d.displayName)}</p><p class="big" style="font-size:38px">${d.year}<br>Wrapped</p></div></div>
    <div class="cols">
      <div><h3>Top artists</h3><ol>${(d.topArtists||[]).map((x,i)=>`<li><span>${i+1}</span>${esc(x.name)}</li>`).join("")}</ol></div>
      <div><h3>Top songs</h3><ol>${(d.topSongs||[]).map((x,i)=>`<li><span>${i+1}</span>${esc(x.name)}</li>`).join("")}</ol></div>
      <div><h3>Minutes listened</h3><p class="kv">${fmt(d.totalMinutes)}</p></div>
      <div><h3>Top genre</h3><p class="kv">${esc(first(d.topGenres)?first(d.topGenres).name:"—")}</p></div>
      <div style="grid-column:1/-1"><h3>Listening personality</h3><p class="kv">${esc(d.personality&&d.personality.name)}</p></div>
    </div>
    <div class="foot"><span>Generated ${esc(d.generatedAt)}</span><button class="replay" type="button" id="replay">Watch again</button></div>`});
  return S;
}

// ---- player ----
const card=document.getElementById("card"), stage=document.getElementById("stage"), slot=document.getElementById("slot"), barsEl=document.getElementById("bars");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let slides=[], cur=0, timer=null, paused=false, startAt=0, remaining=0;

function fit(el){
  // measure the text at a reference size, then scale it to exactly fill the line
  el.style.display="inline-block"; el.style.fontSize="100px";
  const textW=el.getBoundingClientRect().width; el.style.display="";
  const avail=el.clientWidth;
  el.style.fontSize=Math.floor(Math.min(220,100*avail/Math.max(1,textW))*0.98)+"px";
}
function countUp(el){
  const target=+el.dataset.count; if(reduced||!target) return;
  const t0=performance.now(), dur=1600;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmt(Math.round(target*e)); if(p<1) requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
function show(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  const s=slides[cur], th=THEMES[cur%THEMES.length];
  document.documentElement.style.setProperty("--bg",th[0]); document.documentElement.style.setProperty("--fg",th[1]);
  document.querySelector('meta[name="theme-color"]').content=th[0];
  slot.innerHTML=`<section class="slide in ${s.cls||""}" aria-label="Slide ${cur+1} of ${slides.length}">${s.html}</section>`;
  slot.querySelectorAll(".fit").forEach(el=>{fit(el); if(el.dataset.count) countUp(el)});
  const r=document.getElementById("replay"); if(r) r.onclick=e=>{e.stopPropagation();show(0)};
  barsEl.innerHTML=slides.map((_,k)=>`<i class="${k<cur?"done":k===cur?"on":""}"></i>`).join("");
  const dur=s.dur===0?0:(s.dur||7000);
  barsEl.style.setProperty("--dur",(dur||1)/1000+"s");
  schedule(dur);
}
function schedule(ms){
  clearTimeout(timer); remaining=ms; startAt=Date.now();
  if(ms&&!paused) timer=setTimeout(()=>show(cur+1),ms);
}
function setPaused(p){
  paused=p; card.classList.toggle("paused",p);
  const b=document.getElementById("pause"); b.textContent=p?"Play":"Pause"; b.setAttribute("aria-label",p?"Play":"Pause");
  if(p){clearTimeout(timer); remaining=Math.max(0,remaining-(Date.now()-startAt));}
  else if(remaining) schedule(remaining);
}
document.querySelector(".nav.prev").onclick=()=>show(cur-1);
document.querySelector(".nav.next").onclick=()=>show(cur+1);
document.getElementById("pause").onclick=()=>setPaused(!paused);
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();show(cur+1)}
  else if(e.key==="ArrowLeft") show(cur-1);
  else if(e.key==="p"||e.key==="k") setPaused(!paused);
});
addEventListener("resize",()=>slot.querySelectorAll(".fit").forEach(fit));
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&!paused) setPaused(true) });

if(!D||!D.totalPlays){
  slot.innerHTML=`<div class="empty"><p class="lede">No listening data for this year yet. Play some music in Navidrome and generate Wrapped again.</p></div>`;
}else{
  document.title=`${D.displayName}'s ${D.year} Wrapped`;
  document.getElementById("who").textContent=`${D.year} Wrapped`;
  slides=buildSlides(D);
  show(0);
}
</script>
</body>
</html>
